name: Feature Integration

on:
  push:
    branches:
      - 'feature/**'

jobs:
  integrate:
    name: Build and test feature integration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout develop branch
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Fetch all branches
        run: git fetch --all

      - name: Configure git
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

      - name: Merge all feature branches
        run: |
          set -e

          FEATURES=$(git branch -r | grep 'origin/feature/' | sed 's|origin/||')

          for branch in $FEATURES; do
            echo "🔀 Merging $branch into develop"
            git merge --no-ff --no-commit origin/$branch || {
              echo "❌ Conflict while merging $branch"
              exit 1
            }
            git commit -m --allow-empty "Integration merge of $branch"
          done

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Build & test
        run: mvn -B clean test -Djwt.secret_key=${{ secrets.JWT_SECRET_KEY }}
        env:
          SPRING_PROFILES_ACTIVE: DEV
